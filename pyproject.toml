[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-dao-machine"
version = "0.5.0"
description = "知识发现机器: 两条路(问题路产问题/想象路产概念) + 母题库 + 判定器 + 出处链"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ask-dao" }]
keywords = ["knowledge-discovery", "problem-generation", "imagination", "motifs", "philosophy-of-science"]

[project.optional-dependencies]
# 开发/测试用：pip install -e ".[dev]"
dev = ["pytest>=7"]

[project.scripts]
ask-dao-machine = "ask_dao_machine.interface_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ask_dao_machine"]

[tool.setuptools.package-data]
ask_dao_machine = ["assets/*.json"]
