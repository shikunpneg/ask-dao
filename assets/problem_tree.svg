<text x="600.0" y="138" text-anchor="middle" font-size="11" fill="#6b7280">质数 · 回文 · 对称 · …</text>
<text x="600.0" y="156" text-anchor="middle" font-size="11" fill="#6b7280">86 个母题登记</text>
<rect x="730" y="90" width="310" height="76" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="885.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">感受 / 观察</text>
<text x="885.0" y="138" text-anchor="middle" font-size="11" fill="#6b7280">结构化观测 → 输入</text>
<text x="885.0" y="156" text-anchor="middle" font-size="11" fill="#6b7280">问题路入口</text>
<rect x="40" y="216" width="1000" height="84" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/>
<text x="540.0" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">② 问题制造模块</text>
<text x="540.0" y="264" text-anchor="middle" font-size="11" fill="#6b7280">日常问题 → 前问题 → 科学问题  →  基础领域</text>
<text x="540.0" y="282" text-anchor="middle" font-size="11" fill="#6b7280">territory_engine: 问题树 L0-L5 分层 · 谱系门 · 每爬一层必须机器实测</text>
<path d="M140,166 L140,216" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
