<text x="140.0" y="138" text-anchor="middle" font-size="11" fill="#6b7280">视觉 / 听觉 / 文本</text>
<text x="140.0" y="156" text-anchor="middle" font-size="11" fill="#6b7280">网页 / arXiv</text>
<rect x="270" y="90" width="200" height="76" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="1.6"/>
<text x="370.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">日常问题</text>
<text x="370.0" y="138" text-anchor="middle" font-size="11" fill="#6b7280">困惑 / 裂缝 / 疑问</text>
<text x="370.0" y="156" text-anchor="middle" font-size="11" fill="#6b7280">言不尽意 · 黑洞蒸发</text>
