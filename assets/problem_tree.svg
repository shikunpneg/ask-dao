<path d="M600,166 L600,216" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" fill="none"/>
<rect x="40" y="352" width="1000" height="150" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/>
<text x="540.0" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">③ 问题树生长 · 母题 × 组合模板</text>
<text x="540.0" y="400" text-anchor="middle" font-size="11" fill="#6b7280">L0 母题   →   L1 前问题   →   L2 科学问题   →   L3 基础领域   →   L4 问题树   →   L5 领域融合</text>
<text x="540.0" y="418" text-anchor="middle" font-size="11" fill="#6b7280">例: 质数 × 回文数(对象类) + 两项和(规则) + 域构造 → 「回文素数在进位制 b 中的例外」</text>
<text x="540.0" y="436" text-anchor="middle" font-size="11" fill="#6b7280">树与树在结构桥梁处交叉：无共享结构的配对是空洞笛卡尔积</text>
