<text x="540.0" y="56" text-anchor="middle" font-size="12" fill="#6b7280">母题通过组合模板生长为问题树，树与树在结构桥梁处融合 → 新问题</text>
<rect x="40" y="90" width="200" height="76" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="1.6"/>
