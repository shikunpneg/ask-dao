<text x="1144" y="286" font-size="12" fill="#16191d">· LLM 判</text>
<text x="1156" y="301" font-size="10" fill="#7c8188">N0 已知 → N1 大概率已知 → N2 疑似未见 → N3 强候选</text>
<text x="1144" y="336" font-size="12" fill="#16191d">· 人类裁决</text>
<text x="1156" y="351" font-size="10" fill="#7c8188">出版级 / N2–N3 才介入</text>
<line x1="1142" y1="370" x2="1410" y2="370" stroke="#cdc6b6"/>
<text x="1144" y="394" font-size="12.5" fill="#b03a2e">· 出口</text>
<text x="1156" y="409" font-size="10" fill="#7c8188">带出处链的问题清单（母题→模板→绑定→判定）</text>
<text x="1144" y="442" font-size="10.5" fill="#b03a2e">诚实边界：世界新问题（N3）至今为 0，不粉饰</text>
