<text x="210" y="586" font-size="11" fill="#454a51">registry.json（86 母题）→ combo / records / math 引擎 → out/demo/problems_*.json</text>
<text x="1408" y="586" text-anchor="end" font-size="10.5" fill="#2f6b6b">139 母题单元</text>
