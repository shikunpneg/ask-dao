<text x="1408" y="682" text-anchor="end" font-size="10.5" fill="#2f6b6b">S2 广义 Collatz 停时表：索引未见 ×7</text>
<line x1="70" y1="697" x2="1410" y2="697" stroke="#ded7c6" stroke-width="1"/>
<text x="72" y="730" font-size="12.5" fill="#16191d">可视化</text>
<text x="210" y="730" font-size="11" fill="#454a51">问题树 + 概念树 + 概念论证 → docs/viz/paths.html</text>
<text x="1408" y="730" text-anchor="end" font-size="10.5" fill="#2f6b6b">全量 260+ 条 / 23 领域</text>
<line x1="70" y1="745" x2="1410" y2="745" stroke="#ded7c6" stroke-width="1"/>
<text x="72" y="778" font-size="12.5" fill="#16191d">经验检索桥</text>
<text x="210" y="778" font-size="11" fill="#454a51">组合词 → tools/retrieve_browser.py（维基双通道）/ retrieve_context.py（arXiv 回退）→ word_understand 的 M7 经验锚点</text>
<text x="1408" y="778" text-anchor="end" font-size="10.5" fill="#2f6b6b">6,642 组合 · 词条命中 558 · 已成词 37 · 锚点 7 处</text>
