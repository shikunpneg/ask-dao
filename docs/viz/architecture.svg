<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="100%" font-family="Segoe UI,Microsoft YaHei,sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
        orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b02a24"/></marker>
</defs><rect width="1080" height="660" fill="#ffffff"/><text x="540.0" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">问道 · 系统架构</text><text x="540.0" y="56" text-anchor="middle" font-size="12" fill="#6b7280">两条路：一条产问题（需解决），一条产概念（需解释）</text><text x="40" y="96" font-size="13" font-weight="700" fill="#2563eb">问题路 · Problem Path</text><rect x="40" y="108" width="208" height="100" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/><text x="144.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">① 感受模块</text><text x="144.0" y="156" text-anchor="middle" font-size="11.5" fill="#6b7280">视觉 / 听觉 / 网络文本</text><text x="144.0" y="173" text-anchor="middle" font-size="11.5" fill="#6b7280">→ 结构化观测</text><text x="144.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7280">perception · web · arxiv</text><rect x="276" y="108" width="208" height="100" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/><text x="380.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">② 问题制造模块</text><text x="380.0" y="156" text-anchor="middle" font-size="11.5" fill="#6b7280">日常问题 → 前问题 → 科学问题</text><text x="380.0" y="173" text-anchor="middle" font-size="11.5" fill="#6b7280">→ 基础领域 → 问题树 → 融合</text><text x="380.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7280">corpus · counterex · territory</text><rect x="512" y="108" width="208" height="100" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/><text x="616.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">③ 执行模块 AI4S</text><text x="616.0" y="156" text-anchor="middle" font-size="11.5" fill="#6b7280">独立验证 / 求解</text><text x="616.0" y="173" text-anchor="middle" font-size="11.5" fill="#6b7280">裁决回灌</text><text x="616.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7280">ai4s_harness</text><rect x="748" y="108" width="292" height="100" rx="10" fill="#f9fafb" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4"/><text x="894.0" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">出口 · 可判问题清单</text><text x="894.0" y="156" text-anchor="middle" font-size="11.5" fill="#6b7280">每条带 判定路由 + 证据</text><text x="894.0" y="173" text-anchor="middle" font-size="11.5" fill="#6b7280">→ 交 AI4S 求解</text><text x="894.0" y="190" text-anchor="middle" font-size="11.5" fill="#6b7280">标准：答案成立 / 可判</text><path d="M248,158 L276,158" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><text x="262" y="145" text-anchor="middle" font-size="11" fill="#6b7280">结构化</text><path d="M484,158 L512,158" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><text x="498" y="145" text-anchor="middle" font-size="11" fill="#6b7280">问题</text><path d="M720,158 L748,158" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><text x="734" y="145" text-anchor="middle" font-size="11" fill="#6b7280">交付</text><text x="40" y="266" font-size="13" font-weight="700" fill="#a16207">想象路 · Imagination Path</text><rect x="40" y="278" width="208" height="100" rx="10" fill="#f9fafb" stroke="#a16207" stroke-width="1.6" stroke-dasharray="5 4"/><text x="144.0" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">输入 · 词</text><text x="144.0" y="326" text-anchor="middle" font-size="11.5" fill="#6b7280">任意词 / 词对</text><text x="144.0" y="343" text-anchor="middle" font-size="11.5" fill="#6b7280">例：记忆调性</text><text x="144.0" y="360" text-anchor="middle" font-size="11.5" fill="#6b7280">原则：每个词都有意义</text><rect x="276" y="278" width="208" height="100" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/><text x="380.0" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">① 组词</text><text x="380.0" y="326" text-anchor="middle" font-size="11.5" fill="#6b7280">穷尽领域专业词组合</text><text x="380.0" y="343" text-anchor="middle" font-size="11.5" fill="#6b7280">82 × 82 = 6642</text><text x="380.0" y="360" text-anchor="middle" font-size="11.5" fill="#6b7280">word_fusion</text><rect x="512" y="278" width="208" height="100" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/><text x="616.0" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">② 拆词（深度 d）</text><text x="616.0" y="326" text-anchor="middle" font-size="11.5" fill="#6b7280">问"它是什么?" → 拆实体</text><text x="616.0" y="343" text-anchor="middle" font-size="11.5" fill="#6b7280">→ 再问 → 拆到原子概念</text><text x="616.0" y="360" text-anchor="middle" font-size="11.5" fill="#6b7280">depth_sentence</text><rect x="748" y="278" width="292" height="100" rx="10" fill="#f9fafb" stroke="#111111" stroke-width="1.6"/><text x="894.0" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#111111">③ 还原造句 → 成段 → 解释</text><text x="894.0" y="326" text-anchor="middle" font-size="11.5" fill="#6b7280">嵌套 + 推理 + 判断 + 比较</text><text x="894.0" y="343" text-anchor="middle" font-size="11.5" fill="#6b7280">定义 → 判断 → 比较 → 结论</text><text x="894.0" y="360" text-anchor="middle" font-size="11.5" fill="#6b7280">reconstruct · understand_deep</text><path d="M248,328 L276,328" stroke="#a16207" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><text x="262" y="315" text-anchor="middle" font-size="11" fill="#6b7280">词对</text><path d="M484,328 L512,328" stroke="#a16207" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><text x="498" y="315" text-anchor="middle" font-size="11" fill="#6b7280">组合</text><path d="M720,328 L748,328" stroke="#a16207" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><text x="734" y="315" text-anchor="middle" font-size="11" fill="#6b7280">展开</text><rect x="748" y="400" width="292" height="76" rx="10" fill="#f9fafb" stroke="#a16207" stroke-width="1.6" stroke-dasharray="5 4"/><text x="894.0" y="426" text-anchor="middle" font-size="15" font-weight="700" fill="#a16207">出口 · 被理解的概念 / 理论</text><text x="894.0" y="448" text-anchor="middle" font-size="11.5" fill="#6b7280">标准：语法正确 + 逻辑通畅</text><text x="894.0" y="465" text-anchor="middle" font-size="11.5" fill="#6b7280">     + 有推理判断</text><path d="M894,378 L894,400" stroke="#a16207" stroke-width="1.5" marker-end="url(#ah)" fill="none"/><line x1="40" y1="232" x2="1040" y2="232" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 6"/><text x="546" y="228" text-anchor="middle" font-size="10.5" fill="#6b7280">两条路互相独立 · 各有各的成功标准 · 不许互相评判</text><rect x="40" y="512" width="1000" height="112" rx="10" fill="#fef2f2" stroke="#b02a24" stroke-width="1.3"/><text x="60" y="540" font-size="13" font-weight="700" fill="#b02a24">诚实边界（不许粉饰）</text><text x="60" y="565 + i * 20" font-size="11.5" fill="#7f1d1d">· N3（世界新问题）至今 = 0 —— 机器能产「真问题」「已知·未解问题」「参照系未见候选」，但无一条通过三重门槛；</text><text x="60" y="565 + i * 20" font-size="11.5" fill="#7f1d1d">· 「检索未见」≠「新」—— 手头参照系只有 OEIS + 检索，真正的文献门需要人 / 联网；</text><text x="60" y="565 + i * 20" font-size="11.5" fill="#7f1d1d">· 显著性 &gt; 新颖性 —— 任选参数的序列同样「OEIS 未见」，唯一拦得住的是显著性证书。</text></svg>