<text x="68" y="80" font-size="10.5" fill="#7c8188" font-family='"JetBrains Mono","Cascadia Mono","Consolas",monospace' letter-spacing="2.6">ASK-DAO-MACHINE ARCHITECTURE · 两条相互独立的路 + 四模块 + 判定层 + 经验检索桥</text>
