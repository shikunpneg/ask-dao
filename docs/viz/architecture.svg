<text x="422" y="356" font-size="10.5" fill="#7c8188">成功标准：语法正确 + 逻辑通畅 + 有推理判断（概念不是拿来"解决"的）</text>
<text x="422" y="384" font-size="10.5" fill="#9a7b3f">两条路互不评判：用问题路的"这新吗"去判想象路的概念，是范畴错误</text>
<line x1="420" y1="400" x2="1028" y2="400" stroke="#cdc6b6"/>
<text x="422" y="422" font-size="12" fill="#16191d">经验检索桥（可选）</text>
<text x="500" y="422" font-size="9.5" fill="#7c8188" font-family="JetBrains Mono,Consolas,monospace">EXPERIENCE RETRIEVAL · 组合词 → 现实经验 → 经验锚点</text>
<text x="422" y="442" font-size="10.5" fill="#454a51">组合词 → 中文维基双通道（词条通道 / 搜索通道）+ arXiv 回退 → M7 经验锚点写进概念理解</text>
<text x="422" y="458" font-size="10.5" fill="#2f6b6b">两条路可各自单独跑，也可选择过桥；只检索不判真伪，网络失败即退化为无脚手架</text>
