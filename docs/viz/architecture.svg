<text x="70" y="548" font-size="10" fill="#7c8188" font-family="JetBrains Mono,Consolas,monospace" letter-spacing="2">DATA FLOW · REAL ARTIFACTS</text>
<text x="1410" y="532" text-anchor="end" font-size="10.5" fill="#7c8188">每一步都留下可复核的 JSON</text>
